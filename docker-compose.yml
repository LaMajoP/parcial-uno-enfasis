name: emergency-platform

services:
  postgres:
    image: postgis/postgis:16-3.4
    # La imagen oficial de PostGIS solo se publica para amd64. En Apple Silicon
    # corre emulada; se declara explicito para que no dependa del host.
    platform: linux/amd64
    container_name: emergency-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: emergency
      POSTGRES_DB: emergency
      # Solo desarrollo local: no hay contraseña ni secreto en el repositorio.
      # AWS usa Secrets Manager; esta autenticación no se despliega fuera de Docker.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emergency -d emergency"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Job de un solo uso: corre migraciones + seeds y termina. El resto de servicios
  # dependen de el con `condition: service_completed_successfully`, de modo que
  # nunca arrancan contra una base a medio migrar.
  migrate:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: emergency-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      POSTGRES_USER: emergency
      POSTGRES_DB: emergency
    volumes:
      - ./database:/database:ro
    entrypoint: ["bash", "/database/apply.sh", "all"]
    restart: "no"

  intake:
    build:
      context: ./services/intake
      target: local
    container_name: emergency-intake
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://emergency@postgres:5432/emergency
      NOTIFICATION_URL: http://notification:8000
      DISPATCH_URL: http://dispatch:8000
      HTTP_TIMEOUT_SECONDS: 3
      LOG_LEVEL: INFO
    ports:
      - "8001:8000"
    volumes:
      # Bind mount para hot reload: uvicorn --reload recoge los cambios del host.
      - ./services/intake/app:/app/app
      - ./services/intake/tests:/app/tests

  dispatch:
    build:
      context: ./services/dispatch
      target: local
    container_name: emergency-dispatch
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://emergency@postgres:5432/emergency
      INTAKE_URL: http://intake:8000
      NOTIFICATION_URL: http://notification:8000
      HTTP_TIMEOUT_SECONDS: 3
      LOG_LEVEL: INFO
    ports:
      - "8002:8000"
    volumes:
      - ./services/dispatch/app:/app/app
      - ./services/dispatch/tests:/app/tests

  geospatial:
    build:
      context: ./services/geospatial
      target: local
    container_name: emergency-geospatial
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://emergency@postgres:5432/emergency
      LOG_LEVEL: INFO
    ports:
      - "8003:8000"
    volumes:
      - ./services/geospatial/app:/app/app
      - ./services/geospatial/tests:/app/tests

  notification:
    build:
      context: ./services/notification
      target: local
    container_name: emergency-notification
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://emergency@postgres:5432/emergency
      LOG_LEVEL: INFO
    ports:
      - "8004:8000"
    volumes:
      - ./services/notification/app:/app/app
      - ./services/notification/tests:/app/tests

  gateway:
    build: ./gateway
    container_name: emergency-gateway
    restart: unless-stopped
    # Depende de los cuatro: nginx resuelve los nombres de los upstreams al
    # arrancar y no levanta si alguno no existe todavía.
    depends_on: [intake, dispatch, geospatial, notification]
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: emergency-frontend
    restart: unless-stopped
    depends_on: [gateway]
    environment:
      # El frontend habla SOLO con el gateway (§7).
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      # Bind mount para hot reload. node_modules queda como volumen anónimo para
      # que el del contenedor no lo pise el del host (que puede no existir o
      # tener binarios de otra plataforma).
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - /app/node_modules

volumes:
  pgdata:
