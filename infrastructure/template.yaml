AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Emergency Platform production infrastructure

Parameters:

  IntakeImageUri:
    Type: String

  DispatchImageUri:
    Type: String

  GeospatialImageUri:
    Type: String

  NotificationImageUri:
    Type: String

  AllowedOrigin:
    Type: String
    Description: Production Vercel frontend origin
    # falta poner la url de vercel en produccion, por ahora es la de desarrollo

  DatabaseSecretArn:
    Type: String
    Description: ARN of the pre-created Secrets Manager secret emergency-platform/prod/database

  BudgetAlertEmail:
    Type: String
    Description: Email address that receives AWS Budget alerts (subscription confirmation required)

  BudgetLimitUsd:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Maximum monthly AWS cost in USD

  WafRateLimit:
    Type: Number
    Default: 200
    MinValue: 100
    Description: Maximum requests per five minutes for each source IP

Globals:

  Function:
    Timeout: 15
    MemorySize: 512
    Architectures:
      - x86_64
    Tracing: Active
Resources:

  # La configuración no sensible se recupera en cada cold start desde SSM;
  # ninguna Lambda recibe valores de negocio por variables de entorno.
  IntakeRuntimeConfig:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /emergency-platform/prod/services/intake/runtime
      Type: String
      Tier: Standard
      Value: >-
        {"service_transport":"lambda","dispatch_function_name":"emergency-dispatch-prod:prod","notification_function_name":"emergency-notification-prod:prod","http_timeout_seconds":3,"log_level":"INFO"}

  DispatchRuntimeConfig:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /emergency-platform/prod/services/dispatch/runtime
      Type: String
      Tier: Standard
      Value: >-
        {"service_transport":"lambda","intake_function_name":"emergency-intake-prod:prod","notification_function_name":"emergency-notification-prod:prod","http_timeout_seconds":3,"log_level":"INFO"}

  GeospatialRuntimeConfig:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /emergency-platform/prod/services/geospatial/runtime
      Type: String
      Tier: Standard
      Value: >-
        {"http_timeout_seconds":3,"log_level":"INFO"}

  NotificationRuntimeConfig:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /emergency-platform/prod/services/notification/runtime
      Type: String
      Tier: Standard
      Value: >-
        {"http_timeout_seconds":3,"log_level":"INFO"}

  FeatureFlagsApplication:
    Type: AWS::AppConfig::Application
    Properties:
      Name: emergency-platform
      Description: Runtime feature flags for the emergency platform

  AppConfigAlarmRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: appconfig.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadDeploymentAlarms
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                Resource: "*"

  FeatureFlagsEnvironment:
    Type: AWS::AppConfig::Environment
    Properties:
      ApplicationId: !Ref FeatureFlagsApplication
      Name: prod
      Description: Production flags with automatic configuration rollback
      Monitors:
        - AlarmArn: !GetAtt IntakeErrorsAlarm.Arn
          AlarmRoleArn: !GetAtt AppConfigAlarmRole.Arn

  IntakeFeatureFlags:
    Type: AWS::AppConfig::ConfigurationProfile
    Properties:
      ApplicationId: !Ref FeatureFlagsApplication
      Name: intake-feature-flags
      Description: Kill Switch and city rollout for Intake auto-dispatch
      LocationUri: hosted
      Type: AWS.AppConfig.FeatureFlags

  FeatureFlagsDeploymentStrategy:
    Type: AWS::AppConfig::DeploymentStrategy
    Properties:
      Name: emergency-flags-immediate-with-bake
      Description: Applies an operational flag immediately and monitors it for rollback
      DeploymentDurationInMinutes: 0
      FinalBakeTimeInMinutes: 5
      GrowthFactor: 100
      GrowthType: LINEAR
      ReplicateTo: NONE

  IntakeFeatureFlagsInitialVersion:
    Type: AWS::AppConfig::HostedConfigurationVersion
    Properties:
      ApplicationId: !Ref FeatureFlagsApplication
      ConfigurationProfileId: !Ref IntakeFeatureFlags
      ContentType: application/json
      VersionLabel: initial-v1
      Content: |
        {
          "version": "1",
          "flags": {
            "auto_dispatch_enabled": {
              "name": "Auto-dispatch kill switch",
              "description": "Globally enables automatic resource assignment after an emergency is persisted.",
              "attributes": {
                "enabled_cities": {
                  "constraints": {
                    "type": "array",
                    "elements": {
                      "type": "string",
                      "enum": ["CHOCO", "PEREIRA", "CALI", "MANIZALES"]
                    }
                  }
                }
              }
            }
          },
          "values": {
            "auto_dispatch_enabled": {
              "enabled": true,
              "enabled_cities": ["PEREIRA", "MANIZALES"]
            }
          }
        }

  IntakeFeatureFlagsInitialDeployment:
    Type: AWS::AppConfig::Deployment
    Properties:
      ApplicationId: !Ref FeatureFlagsApplication
      EnvironmentId: !Ref FeatureFlagsEnvironment
      ConfigurationProfileId: !Ref IntakeFeatureFlags
      ConfigurationVersion: !Ref IntakeFeatureFlagsInitialVersion
      DeploymentStrategyId: !Ref FeatureFlagsDeploymentStrategy
      Description: Initial production flags; auto-dispatch starts only in Pereira and Manizales

  IntakeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: InvokeInternalServices
              Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:emergency-dispatch-prod:prod"
                - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:emergency-notification-prod:prod"
            - Sid: ReadRuntimeConfiguration
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/emergency-platform/prod/services/intake/runtime"
            - Sid: ReadDatabaseSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DatabaseSecretArn
            - Sid: ReadIntakeFeatureFlags
              Effect: Allow
              Action:
                - appconfig:StartConfigurationSession
                - appconfig:GetLatestConfiguration
              Resource: !Sub "arn:${AWS::Partition}:appconfig:${AWS::Region}:${AWS::AccountId}:application/${FeatureFlagsApplication}/environment/${FeatureFlagsEnvironment}/configuration/${IntakeFeatureFlags}"

      Events:
        CreateEmergency:
          Type: Api
          Properties:
            RestApiId: !Ref EmergencyApi
            Path: /v1/emergencies
            Method: POST
            RequestModel:
              Model: EmergencyCreateModel
              Required: true
              ValidateBody: true
              ValidateParameters: false

        GetEmergency:
          Type: Api
          Properties:
            RestApiId: !Ref EmergencyApi
            Path: /v1/emergencies/{emergency_id}
            Method: GET

        UpdateEmergency:
          Type: Api
          Properties:
            RestApiId: !Ref EmergencyApi
            Path: /v1/emergencies/{emergency_id}/status
            Method: PATCH

      FunctionName: emergency-intake-prod
      PackageType: Image
      ImageUri: !Ref IntakeImageUri
      AutoPublishAlias: prod

  DispatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: InvokeInternalServices
              Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:emergency-intake-prod:prod"
                - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:emergency-notification-prod:prod"
            - Sid: ReadRuntimeConfiguration
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/emergency-platform/prod/services/dispatch/runtime"
            - Sid: ReadDatabaseSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DatabaseSecretArn

      Events:
        CreateDispatch:
          Type: Api
          Properties:
            RestApiId: !Ref EmergencyApi
            Path: /v1/dispatches
            Method: POST

        ListDispatches:
          Type: Api
          Properties:
            RestApiId: !Ref EmergencyApi
            Path: /v1/dispatches
            Method: GET

        UpdateDispatch:
          Type: Api
          Properties:
            RestApiId: !Ref EmergencyApi
            Path: /v1/dispatches/{dispatch_id}
            Method: PATCH

        ListResources:
          Type: Api
          Properties:
            RestApiId: !Ref EmergencyApi
            Path: /v1/resources
            Method: GET

        NearbyResources:
          Type: Api
          Properties:
            RestApiId: !Ref EmergencyApi
            Path: /v1/resources/nearby
            Method: GET

      FunctionName: emergency-dispatch-prod
      PackageType: Image
      ImageUri: !Ref DispatchImageUri
      AutoPublishAlias: prod

  GeospatialFunction:
    Type: AWS::Serverless::Function
    Properties:
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadRuntimeConfiguration
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/emergency-platform/prod/services/geospatial/runtime"
            - Sid: ReadDatabaseSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DatabaseSecretArn

      Events:
        ZoneEmergencies:
          Type: Api
          Properties:
            RestApiId: !Ref EmergencyApi
            Path: /v1/zones/{city}/emergencies
            Method: GET

        ZoneHotspots:
          Type: Api
          Properties:
            RestApiId: !Ref EmergencyApi
            Path: /v1/zones/{city}/hotspots
            Method: GET

      FunctionName: emergency-geospatial-prod
      PackageType: Image
      ImageUri: !Ref GeospatialImageUri
      AutoPublishAlias: prod

  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadRuntimeConfiguration
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/emergency-platform/prod/services/notification/runtime"
            - Sid: ReadDatabaseSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DatabaseSecretArn

      Events:
        CreateNotification:
          Type: Api
          Properties:
            RestApiId: !Ref EmergencyApi
            Path: /v1/notifications
            Method: POST

        ListNotifications:
          Type: Api
          Properties:
            RestApiId: !Ref EmergencyApi
            Path: /v1/notifications
            Method: GET

      FunctionName: emergency-notification-prod
      PackageType: Image
      ImageUri: !Ref NotificationImageUri
      AutoPublishAlias: prod

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: emergency-api-5xx-prod
      AlarmDescription: Alarm when API Gateway returns HTTP 5xx errors
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: emergency-platform-api
        - Name: Stage
          Value: prod
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ApiLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: emergency-api-latency-prod
      AlarmDescription: Alarm when average API latency exceeds 1500 ms
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiName
          Value: emergency-platform-api
        - Name: Stage
          Value: prod
      Statistic: Average
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1500
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  EmergencyApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: emergency-platform-api
      StageName: prod
      EndpointConfiguration: REGIONAL
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 25
      Cors:
        AllowMethods: "'GET,POST,PATCH,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Request-Id'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"
      Models:
        EmergencyCreateModel:
          type: object
          required:
            - type
            - city
            - location
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [RESCUE, SHELTER, SUPPLIES, STRUCTURAL_DAMAGE]
            city:
              type: string
              enum: [CHOCO, PEREIRA, CALI, MANIZALES]
            location:
              type: object
              required: [latitude, longitude]
              additionalProperties: false
              properties:
                latitude:
                  type: number
                  minimum: -4.5
                  maximum: 13
                longitude:
                  type: number
                  minimum: -82
                  maximum: -66
            details:
              type: object

  EmergencyApiWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: emergency-platform-api-rate-limit-prod
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: emergency-platform-api-rate-limit-prod
        SampledRequestsEnabled: true
      Rules:
        - Name: RateLimitPerIp
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: !Ref WafRateLimit
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: rate-limit-per-ip
            SampledRequestsEnabled: true

  EmergencyApiWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    # El ResourceArn se construye con !Sub a partir del ID de la API, asi que
    # CloudFormation solo deduce una dependencia con la RestApi — NO con el stage,
    # que SAM crea como recurso aparte (`<ApiLogicalId><StageName>Stage`).
    # Sin este DependsOn, la asociacion puede intentarse antes de que el stage
    # exista y falla con "The referenced resource does not exist", tumbando la
    # creacion entera del stack.
    DependsOn: EmergencyApiprodStage
    Properties:
      ResourceArn: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${EmergencyApi}/stages/prod"
      WebACLArn: !GetAtt EmergencyApiWebAcl.Arn
  IntakeErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: emergency-intake-errors-prod
      AlarmDescription: Alarm when Intake Lambda produces errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: emergency-intake-prod
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DispatchErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: emergency-dispatch-errors-prod
      AlarmDescription: Alarm when Dispatch Lambda produces errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: emergency-dispatch-prod
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching  
              
  GeospatialErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: emergency-geospatial-errors-prod
      AlarmDescription: Alarm when Geospatial Lambda produces errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: emergency-geospatial-prod
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      
  NotificationErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: emergency-notification-errors-prod
      AlarmDescription: Alarm when Notification Lambda produces errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: emergency-notification-prod
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching    

  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: emergency-platform-monthly-prod
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 85
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail

Outputs:

  ApiUrl:
    Description: Production API Gateway URL
    Value: !Sub "https://${EmergencyApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod"

  FeatureFlagsApplicationId:
    Description: AWS AppConfig application used by Intake
    Value: !Ref FeatureFlagsApplication

  FeatureFlagsEnvironmentId:
    Description: AWS AppConfig production environment
    Value: !Ref FeatureFlagsEnvironment

  IntakeFeatureFlagsProfileId:
    Description: AWS AppConfig profile that contains the Kill Switch
    Value: !Ref IntakeFeatureFlags

  FeatureFlagsDeploymentStrategyId:
    Description: Deployment strategy for runtime configuration changes
    Value: !Ref FeatureFlagsDeploymentStrategy
