name: Backend CI/CD

on:
  pull_request:
    paths:
      - "services/**"
      - "infrastructure/**"
      - ".github/workflows/backend-cd.yml"
  push:
    branches: [main]
    paths:
      - "services/**"
      - "infrastructure/**"
      - ".github/workflows/backend-cd.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-west-2
  STACK_NAME: emergency-platform-prod

jobs:
  verify:
    name: Test and validate infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and SAM tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install aws-sam-cli
      - name: Validate SAM without CodeDeploy
        run: |
          sam validate --template-file infrastructure/template.yaml --lint
          ! rg -n 'CodeDeploy|DeploymentPreference|Canary|EnableCanary' infrastructure/template.yaml
      - name: Run service tests
        run: |
          docker compose build
          make test

  deploy:
    name: Build images and deploy backend
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Provision immutable ECR repositories
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/bootstrap.yaml \
            --stack-name emergency-platform-bootstrap \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset
      - name: Authenticate Docker with ECR
        run: |
          AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_ENV"
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      - name: Build and push Lambda OCI images
        run: |
          for service in intake dispatch geospatial notification; do
            repository="emergencias/${service}"
            if [ "$service" = "geospatial" ]; then
              repository="emergencias/geo"
            fi

            image="${ECR_REGISTRY}/${repository}:${GITHUB_SHA}"

            if aws ecr describe-images \
              --repository-name "$repository" \
              --image-ids imageTag="$GITHUB_SHA" \
              --region "$AWS_REGION" >/dev/null 2>&1; then

              echo "Image already exists, reusing: $image"

            else
              docker build \
                --platform linux/amd64 \
                --provenance=false \
                --target lambda \
                -t "$image" \
                "services/${service}"

              docker push "$image"
            fi

            upper="$(echo "$service" | tr '[:lower:]' '[:upper:]')"
            echo "${upper}_IMAGE=${image}" >> "$GITHUB_ENV"
          done
      # Si la PRIMERA creacion de un stack falla, CloudFormation lo deshace y lo
      # deja en ROLLBACK_COMPLETE: un estado terminal que no admite update. Todo
      # despliegue posterior muere con "can not be updated" y, lo peor, ese
      # mensaje TAPA el error original. La unica salida es borrarlo y recrearlo.
      - name: Delete stack if stuck in ROLLBACK_COMPLETE
        run: |
          status="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo NOT_FOUND)"

          echo "Estado actual del stack: $status"

          if [ "$status" = "ROLLBACK_COMPLETE" ]; then
            echo "Estado terminal: se borra el stack para poder recrearlo desde cero."
            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" --region "$AWS_REGION"
            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" --region "$AWS_REGION"
            echo "Stack borrado."
          fi

      - name: Deploy production stack without CodeDeploy
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              IntakeImageUri="$INTAKE_IMAGE" \
              DispatchImageUri="$DISPATCH_IMAGE" \
              GeospatialImageUri="$GEOSPATIAL_IMAGE" \
              NotificationImageUri="$NOTIFICATION_IMAGE" \
              AllowedOrigin="${{ vars.VERCEL_ORIGIN }}" \
              DatabaseSecretArn="${{ secrets.DATABASE_SECRET_ARN }}" \
              BudgetAlertEmail="${{ secrets.BUDGET_ALERT_EMAIL }}"

      # `aws cloudformation deploy` solo informa de que el despliegue fallo, no de
      # QUE recurso lo tumbo: eso vive en los eventos del stack. Sin este paso hay
      # que entrar a la consola de AWS cada vez, y con un stack que se auto-borra
      # arriba, los eventos desaparecen. El primer CREATE_FAILED de la lista es la
      # causa raiz; los demas son consecuencia del rollback.
      - name: Show why the stack failed
        if: failure()
        run: |
          echo "── Recursos que fallaron, del mas reciente al mas antiguo ──"
          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED'].{Recurso:LogicalResourceId,Tipo:ResourceType,Motivo:ResourceStatusReason}" \
            --output table || echo "No se pudieron leer los eventos del stack."
