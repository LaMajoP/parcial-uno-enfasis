# Gateway local (§7 del spec). Reverse proxy que enruta por prefijo.
#
# El frontend habla SOLO con este gateway, nunca con los puertos de los
# servicios. Cuando esto se sustituya por API Gateway en AWS, el frontend solo
# tendrá que cambiar VITE_API_BASE_URL.

load_module modules/ngx_http_js_module.so;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    js_import health from /etc/nginx/njs/health.js;

    # X-Request-Id (§7): se propaga el que venga y, si no viene, se genera uno.
    # $request_id es un identificador único que nginx crea para cada petición.
    map $http_x_request_id $request_id_final {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format json_logs escape=json
        '{"timestamp":"$time_iso8601","service":"gateway","level":"INFO",'
        '"request_id":"$request_id_final","method":"$request_method",'
        '"path":"$request_uri","status":$status,'
        '"duration_ms":$request_time,"upstream":"$upstream_addr"}';

    access_log /dev/stdout json_logs;
    error_log  /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;

    # Los servicios escuchan en el 8000 dentro de la red de compose; los puertos
    # 8001-8004 solo existen hacia el host, para depurar.
    upstream intake       { server intake:8000; }
    upstream dispatch     { server dispatch:8000; }
    upstream geospatial   { server geospatial:8000; }
    upstream notification { server notification:8000; }

    server {
        listen 8080;
        server_name _;

        # ── CORS ────────────────────────────────────────────────────────────
        # Solo el frontend local. Va en variables para no repetirlo en cada
        # location y para que añadir un origen sea cambiar una línea.
        set $cors_origin "http://localhost:3000";
        set $cors_methods "GET, POST, PATCH, OPTIONS";
        set $cors_headers "Content-Type, Authorization, X-Request-Id";

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id_final;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # ── Endpoints internos: NO se exponen ───────────────────────────────
        # /v1/internal/dispatches/auto es servicio-a-servicio. Bloquearlo aquí
        # es lo que hace que "interno" signifique algo: en AWS este prefijo
        # simplemente no existirá en API Gateway.
        location /v1/internal {
            add_header Content-Type application/json always;
            return 404 '{"success":false,"error":{"code":"NOT_FOUND","message":"Not Found"}}';
        }

        # ── Intake ──────────────────────────────────────────────────────────
        location /v1/emergencies {
            if ($request_method = OPTIONS) { return 204; }
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers "X-Request-Id" always;
            proxy_pass http://intake;
        }

        # ── Geospatial ──────────────────────────────────────────────────────
        location /v1/zones {
            if ($request_method = OPTIONS) { return 204; }
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers "X-Request-Id" always;
            proxy_pass http://geospatial;
        }

        # ── Dispatch ────────────────────────────────────────────────────────
        # Sin barra final: con ella, nginx responde un 301 a las peticiones que
        # llegan sin barra (`/v1/resources`), y el cliente recibe HTML en vez
        # del JSON del contrato.
        location /v1/resources {
            if ($request_method = OPTIONS) { return 204; }
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers "X-Request-Id" always;
            proxy_pass http://dispatch;
        }

        location /v1/dispatches {
            if ($request_method = OPTIONS) { return 204; }
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers "X-Request-Id" always;
            proxy_pass http://dispatch;
        }

        # ── Notification: el stream necesita trato aparte ───────────────────
        # Sin desactivar el búfer, nginx acumula la respuesta y los eventos SSE
        # llegarían a golpes o no llegarían. El read_timeout largo evita que
        # corte una conexión que está esperando el siguiente evento.
        location /v1/notifications/stream {
            if ($request_method = OPTIONS) { return 204; }
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Cache-Control "no-cache" always;
            add_header X-Accel-Buffering "no" always;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_set_header Connection "";
            proxy_pass http://notification;
        }

        location /v1/notifications {
            if ($request_method = OPTIONS) { return 204; }
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods $cors_methods always;
            add_header Access-Control-Allow-Headers $cors_headers always;
            add_header Access-Control-Expose-Headers "X-Request-Id" always;
            proxy_pass http://notification;
        }

        # ── /health agregado de los cuatro servicios ────────────────────────
        location = /health {
            add_header Access-Control-Allow-Origin $cors_origin always;
            js_content health.aggregate;
        }

        # Subpeticiones que usa health.js. `internal` impide que se puedan
        # llamar desde fuera.
        location /_health/intake       { internal; proxy_pass http://intake/health; }
        location /_health/dispatch     { internal; proxy_pass http://dispatch/health; }
        location /_health/geospatial   { internal; proxy_pass http://geospatial/health; }
        location /_health/notification { internal; proxy_pass http://notification/health; }

        # Cualquier otra ruta: mismo formato de error que los servicios, para
        # que el frontend no tenga que distinguir quién respondió.
        location / {
            add_header Content-Type application/json always;
            add_header Access-Control-Allow-Origin $cors_origin always;
            return 404 '{"success":false,"error":{"code":"NOT_FOUND","message":"Not Found"}}';
        }
    }
}
